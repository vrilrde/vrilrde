<svg xmlns="http://www.w3.org/2000/svg" width="490" height="222" viewBox="0 0 490 222"><style>@font-face{font-family:'PS';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'VT';src:url(data:font/woff2;base64,) format('woff2')}
.px{shape-rendering:crispEdges}
.tw{animation:tw 3.2s steps(2,end) infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.15}}
.blink{animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.bob{animation:bob 1.6s steps(2,end) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bob2{animation:bob 2.2s steps(2,end) infinite;animation-delay:-.7s}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.4s steps(4,end) infinite}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.2)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s steps(3,end) infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.dash{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.driftA{animation:driftA 9s ease-in-out infinite}
@keyframes driftA{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
.driftB{animation:driftB 11s ease-in-out infinite}
@keyframes driftB{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
.wave{transform-box:fill-box;transform-origin:left center;animation:wave 1s steps(2,end) infinite}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
